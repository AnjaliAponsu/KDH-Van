    <circle cx="40" cy="35" r="4.5" fill="#ffffff" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="40" cy="35" r="1.5" fill="#f59e0b"/>
    <!-- Aerodynamic KDH Van Silhouette -->
    <path d="M 3 32 L 6 32 C 6 28 8 26 10 26 L 14 26 C 16 26 18 20 23 15 C 27 11 31 10 38 10 L 48 10 C 51 10 52 12 52 15 L 52 30 C 52 32 50 33 48 33 L 45 33" 
          stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Front bumper & Headlight -->
    <path d="M 3 32 C 2 30 2 28 4 27 L 7 26.5" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M 5 25 L 8 25" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
