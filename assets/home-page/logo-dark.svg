    <path d="M 12 23 L 20 23 C 21 23 22 21 22 19 L 20 17 C 17 19 14 21 12 23 Z" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 24 16 L 33 14 C 34 14 35 15 35 16 L 35 23 L 24 23 Z" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 37 14 L 46 14 C 47.5 14 48 14.8 48 16 L 48 23 L 37 23 Z" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Speed accent lines -->
    <path d="M 0 16 L 5 16" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
    <path d="M -3 21 L 4 21" stroke="#f59e0b" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Typography -->
  <text x="68" y="29" fill="#0f172a" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="800" font-size="20" letter-spacing="-0.3">KDH Van Hire</text>
  <text x="69" y="47" fill="#d97706" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="600" font-size="12" letter-spacing="2.5">SRI LANKA</text>
</svg>