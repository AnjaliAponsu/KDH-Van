<svg viewBox="0 0 62 30" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Aerodynamic High Roof Streamline -->
  <path d="M 23 4.2 C 29 2.8, 38 2.8, 46 5" stroke="#FFB900" stroke-width="1.8" stroke-linecap="round"/>
  
  <!-- Main High-Roof Van Silhouette -->
  <path d="M 5 21.5 L 5 12.5 C 5 10.5, 6.5 9.5, 9 9.5 L 12.5 9.5 C 14.5 9.5, 16 8, 18.5 5.5 C 21 3, 24.5 2, 29.5 2 L 44 2 C 48 2, 50.5 3.5, 50.5 7 L 50.5 21.5" 
        stroke="#FFB900" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Driver Front Window -->
  <path d="M 13 10.5 L 18 6 C 19 5.2, 20.5 5, 22.5 5 L 26.5 5 L 26.5 12.5 L 9.5 12.5 C 10.8 12.5, 12.2 11.5, 13 10.5 Z" 
        stroke="#FFB900" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255, 185, 0, 0.15)"/>
  
  <!-- Middle Pillar -->
  <line x1="27.5" y1="5" x2="27.5" y2="12.5" stroke="#FFB900" stroke-width="1.8"/>

