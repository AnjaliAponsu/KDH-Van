  <circle cx="13" cy="21.5" r="1.3" fill="#FFB900"/>

  <!-- Rear Wheel & Hub -->
  <circle cx="40" cy="21.5" r="3.6" stroke="#FFB900" stroke-width="2" fill="#071221"/>
  <circle cx="40" cy="21.5" r="1.3" fill="#FFB900"/>

  <!-- Trailer Hitch Bar -->
  <line x1="44" y1="21.5" x2="47" y2="21.5" stroke="#FFB900" stroke-width="2" stroke-linecap="round"/>

  <!-- Rear Luggage Trailer / Cargo Pod -->
  <path d="M 46.5 21.5 L 48.5 15.5 C 49 14.5, 49.8 14.5, 51 14.5 L 56 14.5 C 57.2 14.5, 58 15.2, 58 16.5 L 58 21.5 C 58 22.5, 57 23, 55.5 23 L 47 23 Z" 
        fill="rgba(255, 185, 0, 0.25)" stroke="#FFB900" stroke-width="1.6" stroke-linejoin="round"/>
  <circle cx="52.5" cy="23.5" r="2" stroke="#FFB900" stroke-width="1.4" fill="#071221"/>
</svg>
