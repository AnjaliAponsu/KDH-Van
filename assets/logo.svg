        stroke="#FFB900" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255, 185, 0, 0.15)"/>

  <!-- Horizontal Body Beltline -->
  <line x1="5" y1="15.5" x2="50.5" y2="15.5" stroke="#FFB900" stroke-width="2" stroke-linecap="round"/>

  <!-- Undercarriage Rocker Sill -->
  <line x1="17.5" y1="21.5" x2="35.5" y2="21.5" stroke="#FFB900" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Front Wheel & Hub -->
